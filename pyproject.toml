[project]
name = "olist-eda"
version = "0.1.0"
description = "EDA de Olist - Portfolio"
authors = [
    {name = "JackyDye",email = "augusto.valles321@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "matplotlib (>=3.9,<4.0)",
    "seaborn (>=0.13,<0.14)",
    "jupyter (>=1.1,<2.0)",
    "notebook (>=7.2,<8.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "openpyxl (>=3.1,<4.0)",
    "kaggle (>=2.1.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
